<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Dashboard Center Graphic -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Central Grid / Pulse emblem -->
    <rect x="32" y="32" width="140" height="140" rx="32" fill="url(#accentGrad)" opacity="0.95"/>
    <path d="M 68 102 L 92 126 L 138 78" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Fitness / Metric Bar -->
    <rect x="212" y="32" width="140" height="60" rx="20" fill="url(#glowGrad)" opacity="0.9"/>
    <circle cx="244" cy="62" r="12" fill="#ffffff"/>
    <circle cx="282" cy="62" r="12" fill="#ffffff" opacity="0.6"/>
    <circle cx="320" cy="62" r="12" fill="#ffffff" opacity="0.3"/>

    <!-- School / Book Symbol -->
    <rect x="212" y="112" width="140" height="140" rx="32" fill="#1e293b" stroke="rgba(99,102,241,0.5)" stroke-width="4"/>
    <path d="M 242 165 C 262 155 282 155 282 155 C 282 155 302 155 322 165 M 242 200 C 262 190 282 190 282 190 C 282 190 302 190 322 200 M 282 155 L 282 205" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>

    <!-- Gym / Dumbbell Shape -->
    <rect x="32" y="212" width="140" height="140" rx="32" fill="#0f172a" stroke="rgba(236,72,153,0.5)" stroke-width="4"/>
    <path d="M 62 257 L 72 257 M 67 247 L 67 267 M 132 307 L 142 307 M 137 297 L 137 317 M 72 262 L 132 302 M 82 252 L 122 312" fill="none" stroke="#ec4899" stroke-width="7" stroke-linecap="round"/>

    <!-- Dynamic Sparkle -->
    <circle cx="330" cy="230" r="8" fill="#a855f7"/>
    <circle cx="290" cy="300" r="14" fill="#6366f1"/>
    <circle cx="240" cy="320" r="6" fill="#38bdf8"/>
    <path d="M 285 280 L 295 280 M 290 275 L 290 285" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
